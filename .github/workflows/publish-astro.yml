# Publish site
name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'  # Every Sunday at 9:00 AM UTC (weekly golf content refresh)

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.month-check.outputs.should_deploy }}
    steps:
      - name: Check deployment window (April–October for scheduled runs)
        id: month-check
        run: |
          MONTH=$(date +%-m)
          SHOULD_DEPLOY=true
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ $MONTH -lt 4 || $MONTH -gt 10 ]]; then
              echo "Scheduled run is outside the April–October window (month=$MONTH), skipping deployment."
              SHOULD_DEPLOY=false
            fi
          fi
          echo "Deployment decision: should_deploy=$SHOULD_DEPLOY (event=${{ github.event_name }}, month=$MONTH)"
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Site
        run: npm run build
        env:
          GOLFCANADA_USERNAME: ${{ secrets.GOLFCANADA_USERNAME }}
          GOLFCANADA_PASSWORD: ${{ secrets.GOLFCANADA_PASSWORD }}
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

